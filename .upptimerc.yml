owner: ParedesYTecho
repo: SkullBoard-Status

sites:
  - name: Bot conectado a Discord
    url: https://skullboard-fra.onrender.com/api/status
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"online":true'
  - name: Base de datos
    url: https://skullboard-fra.onrender.com/api/status
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"provider":"Supabase PostgreSQL","status":"operational"'
  - name: Servidor y API de Render
    url: https://skullboard-fra.onrender.com
  - name: Web pública
    url: https://skullboard.vercel.app/

status-website:
  baseUrl: /SkullBoard-Status
  logoUrl: https://raw.githubusercontent.com/ParedesYTecho/SkullBoard-Status/master/assets/logo.png
  name: SkullBoard · Estado del servicio
  introTitle: "**SkullBoard**: estado del servicio"
  introMessage: Comprobaciones automáticas del bot de Discord, la base de datos, el servidor y la web. Esta página es independiente de la web y del servidor del bot. El historial empieza el día en que se activó.
  navbar:
    - title: Estado
      href: https://paredesytecho.github.io/SkullBoard-Status/
    - title: Web
      href: https://skullboard.vercel.app/

commitMessages:
  commitAuthorName: Upptime Bot
  commitAuthorEmail: 73812536+upptime-bot@users.noreply.github.com
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
secrets: []

i18n:
  up: Operativo
  down: Caído
  degraded: Degradado
  url: Dirección
  status: Estado
  history: Historial
  ms: ms
  responseTime: Tiempo de respuesta
